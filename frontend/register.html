<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — ZYRA Luxury Cosmetics</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" href="../assets/favicon-32x32.png" type="image/png">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <nav class="navbar">
      <a href="../index.html" class="brand-logo-link">
        <img src="../assets/logo.png" alt="ZYRA Logo" class="brand-logo-img">
        <div class="brand-text-block">
          <span class="brand-name">ZYRA</span>
          <span class="brand-tagline">LUXURY COSMETICS</span>
        </div>
      </a>

      <ul class="nav-menu">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="products.html" class="nav-link">Products</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="founder.html" class="nav-link">Founder</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <button class="action-icon-btn theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
        <a href="wishlist.html" class="action-icon-btn">❤️ <span class="badge-count wishlist-badge">0</span></a>
        <a href="cart.html" class="action-icon-btn">🛒 <span class="badge-count cart-badge">0</span></a>
        <a href="login.html" class="action-icon-btn user-action-btn">👤</a>
      </div>
    </nav>
  </header>

  <!-- REGISTER CONTAINER -->
  <div class="container" style="padding: 60px 24px;">
    <div class="product-card" style="max-width: 480px; margin: 0 auto; padding: 40px; background: var(--card-bg);">
      <div class="section-title-wrap" style="margin-bottom: 24px;">
        <div class="eyebrow">Join The Club</div>
        <h1 class="section-title" style="font-size: 2rem;">Create Account</h1>
      </div>

      <form id="register-form">
        <div style="margin-bottom: 16px;">
          <label style="font-size: 0.85rem; font-weight: 600; display:block; margin-bottom: 6px;">Full Name</label>
          <input type="text" id="reg-fullname" required placeholder="Sophia Montgomery" style="width:100%; padding: 12px 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); outline:none;">
        </div>

        <div style="margin-bottom: 16px;">
          <label style="font-size: 0.85rem; font-weight: 600; display:block; margin-bottom: 6px;">Email Address</label>
          <input type="email" id="reg-email" required placeholder="sophia@example.com" style="width:100%; padding: 12px 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); outline:none;">
        </div>

        <div style="margin-bottom: 16px;">
          <label style="font-size: 0.85rem; font-weight: 600; display:block; margin-bottom: 6px;">Phone Number (Optional)</label>
          <input type="tel" id="reg-phone" placeholder="+1 (555) 019-2834" style="width:100%; padding: 12px 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); outline:none;">
        </div>

        <div style="margin-bottom: 20px; position:relative;">
          <label style="font-size: 0.85rem; font-weight: 600; display:block; margin-bottom: 6px;">Password</label>
          <input type="password" id="reg-password" required placeholder="At least 6 characters" style="width:100%; padding: 12px 45px 12px 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); outline:none;">
          <button type="button" class="password-toggle-btn" style="position:absolute; right: 14px; top: 36px; background:none; border:none; cursor:pointer; font-size: 1.1rem;">👁️</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Register Account ✨</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Already a ZYRA member? <a href="login.html" style="color: var(--rose-gold); font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-bottom text-center">
      <p>&copy; 2026 ZYRA Cosmetics. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
