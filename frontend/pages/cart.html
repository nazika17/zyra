<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — ZYRA Luxury Cosmetics</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" href="../assets/favicon-32x32.png" type="image/png">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <nav class="navbar">
      <a href="../index.html" class="brand-logo-link">
        <img src="../assets/logo.png" alt="ZYRA Logo" class="brand-logo-img">
      </a>

      <ul class="nav-menu">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="products.html" class="nav-link">Products</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="founder.html" class="nav-link">Founder</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <button class="action-icon-btn theme-toggle-btn" aria-label="Toggle Theme">🌙</button>

        <a href="wishlist.html" class="action-icon-btn" aria-label="Wishlist">
          ❤️ <span class="badge-count wishlist-badge">0</span>
        </a>

        <a href="cart.html" class="action-icon-btn" aria-label="Cart">
          🛒 <span class="badge-count cart-badge">0</span>
        </a>

        <a href="login.html" class="action-icon-btn user-action-btn" aria-label="Login / Account">
          👤
        </a>

        <div class="hamburger">
          <span></span><span></span><span></span>
        </div>
      </div>
    </nav>
  </header>

  <!-- CART CONTENT -->
  <div class="container" style="padding: 50px 24px;">
    <div class="section-title-wrap" style="text-align: left; margin-bottom: 30px;">
      <div class="eyebrow">Your Selection</div>
      <h1 class="section-title">Shopping Cart</h1>
    </div>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px;">

      <!-- TABLE -->
      <div class="table-wrapper">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="cart-table-body">
            <!-- Loaded dynamically from API/LocalStorage via cart.js -->
          </tbody>
        </table>
      </div>

      <!-- SUMMARY -->
      <div class="product-card" style="padding: 28px; height: fit-content;">
        <h3 style="font-size: 1.3rem; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">Order Summary</h3>

        <div style="display:flex; justify-content:space-between; margin-bottom: 12px;">
          <span style="color: var(--text-muted);">Subtotal</span>
          <strong id="summary-subtotal">₹0.00</strong>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom: 12px;">
          <span style="color: var(--text-muted);">GST Tax (18%)</span>
          <strong id="summary-tax">₹0.00</strong>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom: 16px;">
          <span style="color: var(--text-muted);">Express Delivery</span>
          <strong id="summary-shipping">₹0.00</strong>
        </div>

        <div style="display:flex; justify-content:space-between; font-size: 1.25rem; font-weight: 700; border-top: 1px dashed var(--border-color); padding-top: 16px; margin-bottom: 24px;">
          <span>Total</span>
          <span id="summary-total" style="color: var(--rose-gold);">₹0.00</span>
        </div>

        <button class="btn btn-primary" style="width:100%;" onclick="proceedCheckout()">Proceed to Checkout ✨</button>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-bottom text-center">
      <p>&copy; 2026 ZYRA Cosmetics India. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/cart.js"></script>
</body>
</html>
